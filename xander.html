<title>Xander</title>
<style>*{box-sizing:border-box}
html,body{margin:0;background:#0a0a0a;color:#e8e8e8;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.banner{background:#141414;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,#ff7a18,#00c8ff,#3dff6a) 1;padding:16px 24px}
.banner:hover{background-image:linear-gradient(90deg,#ff7a18,#00c8ff,#3dff6a);color:#0a0a0a}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.gap{justify-content:flex-start}
h1{margin:0;font-size:22px}
.kicker{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9a9a9a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1100px;margin:16px auto;padding:0 16px}
.box{background:#141414;padding:12px;box-shadow:0 0 0 1px #2c2c2c}

.neon:hover{background-image:linear-gradient(90deg,#ff7a18,#00c8ff,#3dff6a);color:#0a0a0a;border-color:transparent}
.ghost{background:transparent}
.muted{color:#9a9a9a;font-size:12px}
.list{max-width:1100px;margin:0 auto 32px;padding:0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.card{background:#141414;padding:12px;box-shadow:0 0 0 1px #2c2c2c}
.card pre{max-height:80px;overflow:auto;min-height:0;font-size:11px;color:#9a9a9a}
.id{margin:0;font-size:14px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
</head>

<script>"use strict";(()=>{var E={1:"元亨，利貞。",2:"元亨，利牝馬之貞。君子有攸往，先迷後得主，利；西南得朋，東北喪朋，安貞吉。",3:"元亨，利貞。勿用有攸往。利建侯。",4:"亨。匪我求童蒙，童蒙求我；初筮告，再三瀆，瀆則不告。利貞。",5:"有孚，光亨，貞吉。利涉大川。",6:"有孚窒惕，中吉；終兇，利見大人，不利涉大川。",7:"貞，丈人吉，無咎。",8:"吉。原筮，元永貞。無咎。不寧方來，後夫兇。",9:"亨。密雲不雨，自我西郊。",10:"履虎尾，不咥人，亨。",11:"小往大來，吉亨。",12:"否之匪人，不利，君子貞；大往小來。",13:"同人於野，亨，利涉大川，利君子貞。",14:"元亨。",15:"亨。君子有終。",16:"利建侯，行師。",17:"元亨，利貞，無咎。",18:"元亨。利涉大川；先甲三日，後甲三日。",19:"元，亨，利，貞。至於八月有兇。",20:"盥而不薦。有孚顒若。",21:"亨。利用獄。",22:"亨。小利有攸往。",23:"不利有攸往。",24:"亨。出入無疾，朋來無咎。反覆其道，七日來複，利有攸往。",25:"元，亨，利，貞。其匪正有眚，不利有攸往。",26:"利貞，不家食吉，利涉大川。",27:"貞吉。觀頤，自求口實。",28:"棟撓，利有攸往，亨。",29:"有孚，維心亨，行有尚。",30:"利貞，亨。畜牝牛，吉。",31:"亨，利貞，取女吉。",32:"亨，無咎，利貞，利有攸往。",33:"亨，小利貞。",34:"利貞。",35:"康侯用錫馬蕃庶，晝日三接。",36:"利艱貞。",37:"利女貞。",38:"小事吉。",39:"利西南，不利東北；利見大人，貞吉。",40:"利西南，無所往，其來複吉。有攸往，夙吉。",41:"有孚，元吉，無咎，可貞，利有攸往？曷之用，二簋可用享。",42:"利有攸往，利涉大川。",43:"揚於王庭，孚號，有厲，告自邑，不利即戎，利有攸往。",44:"女壯，勿用取女。",45:"亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。",46:"元亨，用見大人，勿恤，南征吉。",47:"亨，貞，大人吉，無咎，有言不信。",48:"改邑不改井，無喪無得，往來井井。汔至，亦未繘井，羸其瓶，兇。",49:"已日乃孚，元亨利貞，悔亡。",50:"元吉，亨。",51:"亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。",52:"其背，不獲其身，行其庭，不見其人，無咎。",53:"女歸吉，利貞。",54:"徵兇，無攸利。",55:"亨，王假之，勿憂，宜日中。",56:"小亨，旅貞吉。",57:"小亨，利有攸往，利見大人。",58:"亨，利貞。",59:"亨。王假有廟，利涉大川，利貞。",60:"亨。苦節不可貞。",61:"豚魚吉，利涉大川，利貞。",62:"亨，利貞，可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉。",63:"亨，小利貞，初吉終亂。",64:"亨，小狐汔濟，濡其尾，無攸利。"},$={"1:0":"初九：潛龍勿用。","1:1":"九二：見龍在田，利見大人。","1:2":"九三：君子終日乾乾，夕惕若厲，無咎。","1:3":"九四：或躍在淵，無咎。","1:4":"九五：飛龍在天，利見大人。","1:5":"上九：亢龍有悔。","2:0":"初六：履霜，堅冰至。","2:1":"六二：直，方，大；不習，無不利。","2:2":"六三：含章，可貞。或從王事，無成有終。","2:3":"六四：括囊，無咎無譽。","2:4":"六五：黃裳，元吉。","2:5":"上六：龍戰於野，其血玄黃。","3:0":"初九：磐桓。利居貞。利建侯。","3:1":"六二：屯如邅如。乘馬班如。匪寇。婚媾。女子貞不字，十年乃字。","3:2":"六三：即鹿無虞，惟入於林中。君子幾，不如舍。往，吝。","3:3":"六四：乘馬班如，求婚媾。往，吉。無不利。","3:4":"九五：屯其膏。小貞吉；大貞兇。","3:5":"上六：乘馬班如，泣血漣如。","4:0":"初六：發矇，利用刑人。用說桎梏，以往吝。","4:1":"九二：包蒙，吉。納婦，吉。子克家。","4:2":"六三：勿用取女，見金夫，不有躬。無攸利。","4:3":"六四：困蒙，吝。","4:4":"六五：童蒙，吉。","4:5":"上九：擊蒙，不利爲寇，利禦寇。","5:0":"初九：需於郊，利用恆，無咎。","5:1":"九二：需於沙，小有言，終吉。","5:2":"九三：需於泥，致寇至。","5:3":"六四：需於血，出自穴。","5:4":"九五：需於酒食，貞吉。","5:5":"上六：入於穴，有不速之客三人來，敬之，終吉。","6:0":"初六：不永所事，小有言，終吉。","6:1":"九二：不克訟，歸而逋，其邑人三百戶。無眚。","6:2":"六三：食舊德，貞厲，終吉；或從王事，無成。","6:3":"九四：不克訟，復即命，渝。安貞，吉。","6:4":"九五：訟，元吉。","6:5":"上九：或錫之鞶帶，終朝三褫之。","7:0":"初六：師出以律，否臧兇。","7:1":"九二：在師中，吉，無咎。王三錫命。","7:2":"六三：師或輿尸，兇。","7:3":"六四：師左次，無咎。","7:4":"六五：田有禽，利執言，無咎。長子帥師，弟子輿尸，貞兇。","7:5":"上六：大君有命，開國承家，小人勿用。","8:0":"初六：有孚比之，無咎。有孚盈缶，終來。有它，吉。","8:1":"六二：比之自內，貞吉。","8:2":"六三：比之匪人。","8:3":"六四：外比之，貞吉。","8:4":"九五：顯比；王用三驅，失前禽，邑人不誡，吉。","8:5":"上六：比之無首，兇。","9:0":"初九：復自道，何其咎？吉。","9:1":"九二：牽復，吉。","9:2":"九三：輿說輻，夫妻反目。","9:3":"六四：有孚，血去惕出，無咎。","9:4":"九五：有孚攣如，富以其鄰。","9:5":"上九：既雨既處，尚德載；婦貞厲，月幾望；君子徵兇。","10:0":"初九：素履，往無咎。","10:1":"九二：履道坦坦，幽人貞吉。","10:2":"六三：眇能視，跛能履，履虎尾咥人，兇。武人爲於大君。","10:3":"九四：履虎尾，愬愬，終吉。","10:4":"九五：夬履，貞厲。","10:5":"上九：視履考祥，其旋元吉。","11:0":"初九：拔茅茹，以其匯；徵吉。","11:1":"九二：包荒，用馮河，不遐遺。朋亡，得尚於中行。","11:2":"九三：無平不陂，無往不復。艱貞無咎。勿恤其孚，於食有福。","11:3":"六四：翩翩，不富，以其鄰不戒以孚。","11:4":"六五：帝乙歸妹，以祉元吉。","11:5":"上六：城復於隍。勿用師，自邑告命。貞吝。","12:0":"初六：拔茅茹，以其匯；貞吉，亨。","12:1":"六二：包承，小人吉；大人否，亨。","12:2":"六三：包羞。","12:3":"九四：有命無咎，疇離祉。","12:4":"九五：休否，大人吉；其亡其亡，繫於苞桑。","12:5":"上九：傾否；先否後喜。","13:0":"初九：同人於門，無咎。","13:1":"六二：同人於宗，吝。","13:2":"九三：伏戎於莽，升其高陵，三歲不興。","13:3":"九四：乘其墉，弗克攻，吉。","13:4":"九五：同人，先號咷，而後笑，大師克相遇。","13:5":"上九：同人於郊，無悔。","14:0":"初九：無交害，匪咎；艱則無咎。","14:1":"九二：大車以載，有攸往，無咎。","14:2":"九三：公用亨於天子。小人弗克。","14:3":"九四：匪其彭，無咎。","14:4":"六五：厥孚交如，威如，吉。","14:5":"上九：自天祐之，吉無不利。","15:0":"初六：謙謙君子。用涉大川，吉。","15:1":"六二：鳴謙，貞吉。","15:2":"九三：勞謙，君子有終，吉。","15:3":"六四：無不利，捴謙。","15:4":"六五：不富，以其鄰利用侵伐，無不利。","15:5":"上六：鳴謙，利用行師、徵邑國。","16:0":"初六：鳴豫，兇。","16:1":"六二：介於石，不終日，貞吉。","16:2":"六三：盱豫悔；遲有悔。","16:3":"九四：由豫，大有得，勿疑。朋盍簪。","16:4":"六五：貞疾，恆不死。","16:5":"上六：冥豫，成有渝，無咎。","17:0":"初九：官有渝，貞吉。出門交有功。","17:1":"六二：系小子，失丈夫。","17:2":"六三：系丈夫，失小子；隨有求得，利居貞。","17:3":"九四：隨有獲，貞兇；有孚在道，以明，何咎。","17:4":"九五：孚於嘉，吉。","17:5":"上六：拘繫之，乃從，維之；王用亨於西山。","18:0":"初六：幹父之蠱，有子考無咎，厲終吉。","18:1":"九二：幹母之蠱，不可貞。","18:2":"九三：幹父之蠱，小有悔，無大咎。","18:3":"六四：裕父之蠱，往見吝。","18:4":"六五：幹父之蠱，用譽。","18:5":"上九：不事王侯，高尚其事。","19:0":"初九：鹹臨，貞吉。","19:1":"九二：鹹臨，吉無不利。","19:2":"六三：甘臨，無攸利。既憂之，無咎。","19:3":"六四：至臨，無咎。","19:4":"六五：知臨，大君之宜，吉。","19:5":"上六：敦臨，吉無咎。","20:0":"初六：童觀，小人無咎，君子吝。","20:1":"六二：窺觀，利女貞。","20:2":"六三：觀我生，進退。","20:3":"六四：觀國之光，利用賓於王。","20:4":"九五：觀我生，君子無咎。","20:5":"上九：觀其生，君子無咎。","21:0":"初九：屨校滅趾，無咎。","21:1":"六二：噬膚滅鼻，無咎。","21:2":"六三：噬臘肉，遇毒；小吝，無咎。","21:3":"九四：噬幹胏，得金矢，利艱貞，吉。","21:4":"六五：噬乾肉，得黃金，貞厲，無咎。","21:5":"上九：何校滅耳，兇。","22:0":"初九：賁其趾，舍車而徒。","22:1":"六二：賁其須。","22:2":"九三：賁如濡如，永貞吉。","22:3":"六四：賁如皤如，白馬翰如，匪寇婚媾。","22:4":"六五：賁於丘園，束帛戔戔，吝，終吉。","22:5":"上九：白賁，無咎。","23:0":"初六：剝牀以足，蔑貞兇。","23:1":"六二：剝牀以辨，蔑貞兇。","23:2":"六三：剝之，無咎。","23:3":"六四：剝牀以膚，兇。","23:4":"六五：貫魚，以宮人寵，無不利。","23:5":"上九：碩果不食，君子得輿，小人剝廬。","24:0":"初九：不遠復，無祗悔，元吉。","24:1":"六二：休復，吉。","24:2":"六三：頻復，厲無咎。","24:3":"六四：中行獨復。","24:4":"六五：敦復，無悔。","24:5":"上六：迷復，兇，有災眚。用行師，終有大敗，以其國君，兇；至於十年，不克徵。","25:0":"初九：無妄，往吉。","25:1":"六二：不耕穫，不菑畲，則利用攸往。","25:2":"六三：無妄之災，或繫之牛，行人之得，邑人之災。","25:3":"九四：可貞。無咎。","25:4":"九五：無妄之疾，勿藥有喜。","25:5":"上九：無妄，行有眚，無攸利。","26:0":"初九：有厲利已。","26:1":"九二：輿說輹。","26:2":"九三：良馬逐，利艱貞。曰閒輿衛，利有攸往。","26:3":"六四：童牛之牿，元吉。","26:4":"六五：豶豕之牙，吉。","26:5":"上九：何天之衢，亨。","27:0":"初九：舍爾靈龜，觀我朵頤，兇。","27:1":"六二：顛頤，拂經，於丘頤，徵兇。","27:2":"六三：拂頤，貞兇，十年勿用，無攸利。","27:3":"六四：顛頤吉，虎視眈眈，其欲逐逐，無咎。","27:4":"六五：拂經，居貞吉，不可涉大川。","27:5":"上九：由頤，厲吉，利涉大川。","28:0":"初六：藉用白茅，無咎。","28:1":"九二：枯楊生稊，老夫得其女妻，無不利。","28:2":"九三：棟橈，兇。","28:3":"九四：棟隆，吉；有它吝。","28:4":"九五：枯楊生華，老婦得其士夫，無咎無譽。","28:5":"上六：過涉滅頂，兇，無咎。","29:0":"初六：習坎，入於坎窞，兇。","29:1":"九二：坎有險，求小得。","29:2":"六三：來之坎，坎險且枕，入於坎窞，勿用。","29:3":"六四：樽酒簋貳，用缶，納約自牖，終無咎。","29:4":"九五：坎不盈，祗既平，無咎。","29:5":"上六：系用徽纆，窴於叢棘，三歲不得，兇。","30:0":"初九：履錯然，敬之無咎。","30:1":"六二：黃離，元吉。","30:2":"九三：日昃之離，不鼓缶而歌，則大耋之嗟，兇。","30:3":"九四：突如其來如，焚如，死如，棄如。","30:4":"六五：出涕沱若，戚嗟若，吉。","30:5":"上九：王用出徵，有嘉折首，獲匪其醜，無咎。","31:0":"初六：鹹其拇。","31:1":"六二：鹹其腓，兇，居吉。","31:2":"九三：鹹其股，執其隨，往吝。","31:3":"九四：貞吉悔亡，憧憧往來，朋從爾思。","31:4":"九五：鹹其脢，無悔。","31:5":"上六：鹹其輔，頰，舌。","32:0":"初六：浚恆，貞兇，無攸利。","32:1":"九二：悔亡。","32:2":"九三：不恆其德，或承之羞，貞吝。","32:3":"九四：田無禽。","32:4":"六五：恆其德，貞，婦人吉，夫子兇。","32:5":"上六：振恆，兇。","33:0":"初六：遯尾，厲，勿用有攸往。","33:1":"六二：執之用黃牛之革，莫之勝說。","33:2":"九三：系遯，有疾厲，畜臣妾吉。","33:3":"九四：好遯君子吉，小人否。","33:4":"九五：嘉遯，貞吉。","33:5":"上九：肥遯，無不利。","34:0":"初九：壯於趾，徵兇，有孚。","34:1":"九二：貞吉。","34:2":"九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。","34:3":"九四：貞吉，悔亡。藩決不羸，壯於大輿之輹。","34:4":"六五：喪羊於易，無悔。","34:5":"上六：羝羊觸藩，不能退，不能遂，無攸利，艱則吉。","35:0":"初六：晉如，摧如，貞吉。罔孚，裕無咎。","35:1":"六二：晉如，愁如，貞吉。受茲介福於，其王母。","35:2":"六三：衆允，悔亡。","35:3":"九四：晉如鼫鼠，貞厲。","35:4":"六五：悔亡，失得勿恤，往吉無不利。","35:5":"上九：晉其角，維用伐邑，厲吉無咎，貞吝。","36:0":"初九：明夷于飛，垂其翼。君子於行，三日不食，有攸往， 主人有言。","36:1":"六二：明夷，夷於左股，用拯馬壯，吉。","36:2":"九三：明夷於南狩，得其大首，不可疾貞。","36:3":"六四：入於左腹，獲明夷之心，於出門庭。","36:4":"六五：箕子之明夷，利貞。","36:5":"上六：不明晦，初登於天，後入於地。","37:0":"初九：閒有家，悔亡。","37:1":"六二：無攸遂，在中饋，貞吉。","37:2":"九三：家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。","37:3":"六四：富家，大吉。","37:4":"九五：王假有家，勿恤，吉。","37:5":"上九：有孚威如，終吉。","38:0":"初九：悔亡，喪馬勿逐，自復；見惡人無咎。","38:1":"九二：遇主於巷，無咎。","38:2":"六三：見輿曳，其牛掣，其人天且劓，無初有終。","38:3":"九四：睽孤，遇元夫，交孚，厲無咎。","38:4":"六五：悔亡，厥宗噬膚，往何咎？","38:5":"上九：睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。","39:0":"初六：往蹇，來譽。","39:1":"六二：王臣蹇蹇，匪躬之故。","39:2":"九三：往蹇來反。","39:3":"六四：往蹇來連。","39:4":"九五：大蹇朋來。","39:5":"上六：往蹇來碩，吉；利見大人。","40:0":"初六：無咎。","40:1":"九二：田獲三狐，得黃矢，貞吉。","40:2":"六三：負且乘，致寇至，貞吝。","40:3":"九四：解而拇，朋至斯孚。","40:4":"六五：君子維有解，吉；有孚於小人。","40:5":"上六：公用射隼，於高墉之上，獲之，無不利。","41:0":"初九：已事遄往，無咎。酌損之。","41:1":"九二：利貞，徵兇，弗損益之。","41:2":"六三：三人行，則損一人；一人行，則得其友。","41:3":"六四：損其疾，使遄有喜，無咎。","41:4":"六五：或益之，十朋之龜弗克違，元吉。","41:5":"上九：弗損益之，無咎，貞吉，利有攸往，得臣無家。","42:0":"初九：利用爲大作，元吉，無咎。","42:1":"六二：或益之，十朋之龜弗克違，永貞吉。王用享於帝，吉。","42:2":"六三：益之用凶事，無咎。有孚中行，告公用圭。","42:3":"六四：中行，告公從。利用爲依遷國。","42:4":"九五：有孚惠心，勿問元吉。有孚惠我德。","42:5":"上九：莫益之，或擊之，立心勿恆，兇。","43:0":"初九：壯於前趾，往不勝爲咎。","43:1":"九二：惕號，莫夜有戎，勿恤。","43:2":"九三：壯於頄，有兇。君子夬夬，獨行遇雨，若濡有慍，無咎。","43:3":"九四：臀無膚，其行次且。牽羊悔亡，聞言不信。","43:4":"九五：莧陸夬夬，中行無咎。","43:5":"上六：無號，終有兇。","44:0":"初六：繫於金柅，貞吉，有攸往，見兇，羸豕孚蹢躅。","44:1":"九二：包有魚，無咎，不利賓。","44:2":"九三：臀無膚，其行次且，厲，無大咎。","44:3":"九四：包無魚，起兇。","44:4":"九五：以杞包瓜，含章，有隕自天。","44:5":"上九：姤其角，吝，無咎。","45:0":"初六：有孚不終，乃亂乃萃，若號一握爲笑，勿恤，往無咎。","45:1":"六二：引吉，無咎，孚乃利用禴。","45:2":"六三：萃如，嗟如，無攸利，往無咎，小吝。","45:3":"九四：大吉，無咎。","45:4":"九五：萃有位，無咎。匪孚，元永貞，悔亡。","45:5":"上六：齎諮涕洟，無咎。","46:0":"初六：允升，大吉。","46:1":"九二：孚乃利用禴，無咎。","46:2":"九三：升虛邑。","46:3":"六四：王用亨於岐山，吉無咎。","46:4":"六五：貞吉，升階。","46:5":"上六：冥升，利於不息之貞。","47:0":"初六：臀困於株木，入於幽谷，三歲不覿。","47:1":"九二：困於酒食，朱紱方來，利用享祀，徵兇，無咎。","47:2":"六三：困於石，據於蒺藜，入於其宮，不見其妻，兇。","47:3":"九四：來徐徐，困於金車，吝，有終。","47:4":"九五：劓刖，困於赤紱，乃徐有說，利用祭祀。","47:5":"上六：困於葛藟，於臲<臬兀>，曰動悔。有悔，徵吉。","48:0":"初六：井泥不食，舊井無禽。","48:1":"九二：井谷射鮒，甕敝漏。","48:2":"九三：井渫不食，爲我心惻，可用汲，王明，並受其福。","48:3":"六四：井甃，無咎。","48:4":"九五：井洌，寒泉食。","48:5":"上六：井收勿幕，有孚元吉。","49:0":"初九：鞏用黃牛之革。","49:1":"六二：巳日乃革之，徵吉，無咎。","49:2":"九三：徵兇，貞厲，革言三就，有孚。","49:3":"九四：悔亡，有孚改命，吉。","49:4":"九五：大人虎變，未佔有孚。","49:5":"上六：君子豹變，小人革面，徵兇，居貞吉。","50:0":"初六：鼎顛趾，利出否，得妾以其子，無咎。","50:1":"九二：鼎有實，我仇有疾，不我能即，吉。","50:2":"九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。","50:3":"九四：鼎折足，覆公餗，其形渥，兇。","50:4":"六五：鼎黃耳金鉉，利貞。","50:5":"上九：鼎玉鉉，大吉，無不利。","51:0":"初九：震來虩虩，後笑言啞啞，吉。","51:1":"六二：震來厲，億喪貝，躋於九陵，勿逐，七日得。","51:2":"六三：震蘇蘇，震行無眚。","51:3":"九四：震遂泥。","51:4":"六五：震往來厲，意無喪，有事。","51:5":"上六：震索索，視矍矍，徵兇。震不於其躬，於其鄰，無咎。婚媾有言。","52:0":"初六：艮其趾，無咎，利永貞。","52:1":"六二：艮其腓，不拯其隨，其心不快。","52:2":"九三：艮其限，列其夤，厲燻心。","52:3":"六四：艮其身，無咎。","52:4":"六五：艮其輔，言有序，悔亡。","52:5":"上九：敦艮，吉。","53:0":"初六：鴻漸於幹，小子厲，有言，無咎。","53:1":"六二：鴻漸於磐，飲食衎衎，吉。","53:2":"九三：鴻漸於陸，夫徵不復，婦孕不育，兇；利禦寇。","53:3":"六四：鴻漸於木，或得其桷，無咎。","53:4":"九五：鴻漸於陵，婦三歲不孕，終莫之勝，吉。","53:5":"上九：鴻漸於陸，其羽可用爲儀，吉。","54:0":"初九：歸妹以娣，跛能履，徵吉。","54:1":"九二：眇能視，利幽人之貞。","54:2":"六三：歸妹以須，反歸以娣。","54:3":"九四：歸妹愆期，遲歸有時。","54:4":"六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。","54:5":"上六：女承筐無實，士刲羊無血，無攸利。","55:0":"初九：遇其配主，雖旬無咎，往有尚。","55:1":"六二：豐其蔀，日中見鬥，往得疑疾，有孚發若，吉。","55:2":"九三：豐其沛，日中見沫，折其右肱，無咎。","55:3":"九四：豐其蔀，日中見鬥，遇其夷主，吉。","55:4":"六五：來章，有慶譽，吉。","55:5":"上六：豐其屋，蔀其家，窺其戶，闃其無人，三歲不覿，兇。","56:0":"初六：旅瑣瑣，斯其所取災。","56:1":"六二：旅即次，懷其資，得童僕貞。","56:2":"九三：旅焚其次，喪其童僕，貞厲。","56:3":"九四：旅於處，得其資斧，我心不快。","56:4":"六五：射雉一矢亡，終以譽命。","56:5":"上九：鳥焚其巢，旅人先笑後號。喪牛於易，兇。","57:0":"初六：進退，利武人之貞。","57:1":"九二：巽在牀下，用史巫紛若吉，無咎。","57:2":"九三：頻巽，吝。","57:3":"六四：悔亡，田獲三品。","57:4":"九五：貞吉悔亡，無不利。無初有終，先庚三日，後庚三日，吉。","57:5":"上九：巽在牀下，喪其資斧，貞兇。","58:0":"初九：和兌，吉。","58:1":"九二：孚兌，吉，悔亡。","58:2":"六三：來兌，兇。","58:3":"九四：商兌，未寧，介疾有喜。","58:4":"九五：孚於剝，有厲。","58:5":"上六：引兌。","59:0":"初六：用拯馬壯，吉。","59:1":"九二：渙奔其機，悔亡。","59:2":"六三：渙其躬，無悔。","59:3":"六四：渙其羣，元吉。渙有丘，匪夷所思。","59:4":"九五：渙汗其大號，渙王居，無咎。","59:5":"上九：渙其血，去逖出，無咎。","60:0":"初九：不出戶庭，無咎。","60:1":"九二：不出門庭，兇。","60:2":"六三：不節若，則嗟若，無咎。","60:3":"六四：安節，亨。","60:4":"九五：甘節，吉；往有尚。","60:5":"上六：苦節，貞兇，悔亡。","61:0":"初九：虞吉，有他不燕。","61:1":"九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。","61:2":"六三：得敵，或鼓或罷，或泣或歌。","61:3":"六四：月幾望，馬匹亡，無咎。","61:4":"九五：有孚攣如，無咎。","61:5":"上九：翰音登於天，貞兇。","62:0":"初六：飛鳥以兇。","62:1":"六二：過其祖，遇其妣；不及其君，遇其臣；無咎。","62:2":"九三：弗過防之，從或戕之，兇。","62:3":"九四：無咎，弗過遇之。往厲必戒，勿用永貞。","62:4":"六五：密雲不雨，自我西郊，公弋取彼在穴。","62:5":"上六：弗遇過之，飛鳥離之，兇，是謂災眚。","63:0":"初九：曳其輪，濡其尾，無咎。","63:1":"六二：婦喪其茀，勿逐，七日得。","63:2":"九三：高宗伐鬼方，三年克之，小人勿用。","63:3":"六四：繻有衣袽，終日戒。","63:4":"九五：東鄰殺牛，不如西鄰之禴祭，實受其福。","63:5":"上六：濡其首，厲。","64:0":"初六：濡其尾，吝。","64:1":"九二：曳其輪，貞吉。","64:2":"六三：未濟，徵兇，利涉大川。","64:3":"九四：貞吉，悔亡，震用伐鬼方，三年有賞於大國。","64:4":"六五：貞吉，無悔，君子之光，有孚，吉。","64:5":"上九：有孚於飲酒，無咎，濡其首，有孚失是。"},G={1:"用九：見羣龍無首，吉。",2:"用六：利永貞。"};var Oe=[{bits:"111",name:"Qian",hanzi:"乾",image:"Heaven"},{bits:"110",name:"Dui",hanzi:"兌",image:"Lake"},{bits:"101",name:"Li",hanzi:"離",image:"Fire"},{bits:"100",name:"Zhen",hanzi:"震",image:"Thunder"},{bits:"011",name:"Xun",hanzi:"巽",image:"Wind"},{bits:"010",name:"Kan",hanzi:"坎",image:"Water"},{bits:"001",name:"Gen",hanzi:"艮",image:"Mountain"},{bits:"000",name:"Kun",hanzi:"坤",image:"Earth"}].map((e,t)=>({...e,glyph:String.fromCodePoint(9776+t)})),ze=Object.fromEntries(Oe.map(e=>[e.bits,e]));function M(e){let t=ze[e];if(!t)throw new Error(`unknown trigram ${e}`);return t}var De=["乾","坤","屯","蒙","需","訟","師","比","小畜","履","泰","否","同人","大有","謙","豫","隨","蠱","臨","觀","噬嗑","賁","剝","復","無妄","大畜","頤","大過","坎","離","咸","恆","遯","大壯","晉","明夷","家人","睽","蹇","解","損","益","夬","姤","萃","升","困","井","革","鼎","震","艮","漸","歸妹","豐","旅","巽","兌","渙","節","中孚","小過","既濟","未濟"];function We(e){return String.fromCodePoint(19904+e-1)}var Ke=[{number:1,name:"Qian",english:"The Creative",bits:"111111"},{number:2,name:"Kun",english:"The Receptive",bits:"000000"},{number:3,name:"Zhun",english:"Difficulty at the Beginning",bits:"100010"},{number:4,name:"Meng",english:"Youthful Folly",bits:"010001"},{nu
